name: Build Kyoto Opal Porymap
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_mingw'
          cache: true
      - name: Patch and build Porymap
        shell: pwsh
        run: |
          python tools/kyoto_opal_porymap/build_kyoto_porymap.py --qmake qmake --make mingw32-make --jobs 4
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $build = "tools/kyoto_opal_porymap/build/porymap-build"
          $exe = Get-ChildItem -Path $build -Recurse -Filter porymap.exe | Select-Object -First 1
          if (-not $exe) { throw "porymap.exe not found" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe.FullName artifact/porymap-kyoto-opal.exe
          windeployqt artifact/porymap-kyoto-opal.exe
      - uses: actions/upload-artifact@v4
        with:
          name: porymap-kyoto-opal-windows
          path: artifact
